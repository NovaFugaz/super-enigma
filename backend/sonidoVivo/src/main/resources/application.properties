spring.application.name=sonidovivo-backend
server.port=8080

#  MySQL 
spring.datasource.url=jdbc:mysql://localhost:3306/sonidovivo?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:cambia_esta_clave}

# JPA / Hibernate 
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#  JWT 
app.jwt.secret=${JWT_SECRET:sonido-vivo-clave-secreta-de-desarrollo-minimo-32-caracteres}
app.jwt.expiration-ms=3600000

#  Swagger 
springdoc.swagger-ui.path=/swagger-ui.html