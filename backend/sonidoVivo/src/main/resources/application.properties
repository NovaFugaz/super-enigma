spring.application.name=sonidovivo-backend
server.port=8080

#  MySQL (migración)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/sonidovivo?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:sonidovivo}
spring.datasource.password=${DB_PASSWORD:sonidovivo-local}

# JPA
spring.jpa.hibernate.ddl-auto=update
# Evita que Hibernate autodetecte MariaDBDialect contra el servidor MySQL 8.4.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Valores de demostración
app.jwt.secret=${JWT_SECRET:SonidoVivoSoloLaboratorioClaveSecretaDeEjemploMuyLarga12345}
app.jwt.issuer=sonidovivo
app.jwt.expiration-minutes=60

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.frontend-url=${FRONTEND_URL:http://localhost:5173}