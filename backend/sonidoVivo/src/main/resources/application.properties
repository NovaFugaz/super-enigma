spring.application.name=sonidoVivo
server.port=8080

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sonidovivo?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Script de inicialización
spring.sql.init.mode=always
spring.sql.init.schema-locations=${DB_INIT_SQL:file:../init.sql}
spring.sql.init.encoding=UTF-8

# CORS (frontend)
app.cors.allowed-origins=http://localhost:5173

# JWT 
app.jwt.secret=${JWT_SECRET:KkGGPWqunMnf+/OzOjMsdHBjU5VhkQyVX3D7QOopAeA=}
app.jwt.issuer=sonidovivo
app.jwt.expiration-minutes=120

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true