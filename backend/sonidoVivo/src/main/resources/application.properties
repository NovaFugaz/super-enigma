spring.application.name=sonidovivo-backend
server.port=8080

#  MySQL (migración)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sonidovivo?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:sonidovivo}
spring.datasource.password=${DB_PASSWORD:sonidovivo123}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
